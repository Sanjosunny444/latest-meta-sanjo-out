# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-sanjo"
BBFILE_PATTERN_meta-sanjo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-sanjo = "10"

LAYERDEPENDS_meta-sanjo = "core"
LAYERSERIES_COMPAT_meta-sanjo = "scarthgap"
